name: CI

# Engine checks and bot simulations at 4, 3 and 2 players on every push and PR.
# Deploying is manual, like the other kat.lu games: run .\redeploy.ps1 from Windows.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
