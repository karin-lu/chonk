name: Deploy

# main → test → image on GHCR → pull and restart the `chonk` service on the server.
# The service and its Caddy entry (chonk.kat.lu) live in karin-lu/website's compose.yml and Caddyfile.
# Needs, in this repo's settings: secret SSH_PRIVATE_KEY and variable SSH_HOST (same values as karin-lu/website).

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.ts'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Pull and restart chonk
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ vars.SSH_HOST }} \
            "export CHONK_IMAGE=${{ env.IMAGE }}:latest \
             && docker compose -f /opt/website/compose.yml pull chonk \
             && docker compose -f /opt/website/compose.yml up -d --no-deps chonk"
